<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настройки — Центр управления клиникой</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#27388f;--blue2:#4556d6;--blue-grad1:#1e2d73;--blue-grad2:#3044a6;
    --ink:#0b1536;--ink-mid:#46546d;--ink-soft:#8792a8;
    --bg:#eef3f8;--white:#ffffff;--border:#dfe6f1;
    --green:#1b7e3c;--green-bg:#e3f4e8;--red:#c62828;--red-bg:#f9e2e2;
  }
  body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:17px;
  }

  /* ---------- Контейнер как у дашборда ---------- */
  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--white);position:relative;padding-bottom:40px}
  @media(min-width:760px){.app{margin:20px auto;border-radius:20px;overflow:hidden;box-shadow:0 18px 55px rgba(16,36,95,.13);min-height:auto}}

  /* ---------- Шапка ---------- */
  .header{
    background:linear-gradient(135deg,var(--blue-grad1) 0%,var(--blue-grad2) 100%);
    color:#fff;
    padding:16px 16px 18px;
  }
  .header-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.14);
    color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:10px;padding:8px 14px;
    font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;
  }
  .back-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .header h1{font-size:21px;font-weight:700;letter-spacing:.3px}
  .header p{font-size:13.5px;opacity:.85;margin-top:3px}

  /* ---------- Статус связи ---------- */
  .conn-status{text-align:center;font-size:14px;padding:9px 12px;background:var(--bg)}
  .conn-ok{color:var(--green)}
  .conn-error{color:var(--red)}

  /* ---------- Вкладки ---------- */
  .tabs{display:flex;gap:10px;padding:14px 14px 0}
  .tab-btn{
    flex:1;padding:13px 8px;font-size:16.5px;font-weight:700;
    background:var(--white);color:var(--ink-soft);
    border:2px solid var(--border);border-radius:12px;cursor:pointer;
  }
  .tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* ---------- Секции ---------- */
  .section{padding:6px 14px 16px;display:none}
  .section.active{display:block}
  .block-title{font-size:17px;font-weight:700;margin:16px 2px 9px;color:var(--blue)}

  /* ---------- Карточки и формы ---------- */
  .card{background:var(--white);border:2px solid var(--border);border-radius:14px;padding:15px}
  label{display:block;font-size:14.5px;color:var(--ink-mid);margin:11px 2px 5px}
  label:first-child{margin-top:0}
  input[type="text"],input[type="number"]{
    width:100%;padding:13px 12px;font-size:17.5px;color:var(--ink);
    background:var(--white);border:2px solid #c6cfe0;border-radius:10px;
  }
  input:focus{outline:none;border-color:var(--blue2)}

  .btn{display:inline-block;padding:13px 18px;font-size:16.5px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:13px}
  .btn-add{background:var(--blue);color:#fff;width:100%}
  .btn-save{background:var(--green);color:#fff}
  .btn-cancel{background:#ececf1;color:#444;margin-left:8px}
  .btn-edit{background:#eef2ff;color:var(--blue);border:2px solid var(--blue2);padding:9px 15px;font-size:15px}
  .btn-toggle{background:#ececf1;color:#444;padding:9px 15px;font-size:15px;margin-left:8px}

  /* ---------- Список записей ---------- */
  .item{background:var(--white);border:2px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .item.inactive{opacity:.55}
  .item-name{font-size:17.5px;font-weight:700}
  .item-sub{font-size:14.5px;color:var(--ink-soft);margin-top:3px}
  .item-price{font-size:16.5px;color:var(--blue);font-weight:700;margin-top:3px}
  .item-badge{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:20px;margin-top:6px;font-weight:600}
  .badge-on{background:var(--green-bg);color:var(--green)}
  .badge-off{background:var(--red-bg);color:var(--red)}
  .item-actions{margin-top:10px}

  /* ---------- Сообщения ---------- */
  .msg{padding:0 14px}
  .msg-inner{padding:12px 14px;border-radius:10px;font-size:15.5px;margin-top:10px;display:none;font-weight:600}
  .msg-ok{background:var(--green-bg);color:var(--green)}
  .msg-error{background:var(--red-bg);color:var(--red)}

  .loading{text-align:center;color:var(--ink-soft);padding:20px;font-size:15.5px}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-top">
      <a class="back-btn" href="index.html">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        На главную
      </a>
    </div>
    <h1>⚙️ Настройки клиники</h1>
    <p>Справочники: врачи и услуги</p>
  </div>

  <div class="conn-status" id="connStatus">Проверяю связь с базой…</div>

  <div class="msg"><div class="msg-inner" id="msgBox"></div></div>

  <div class="tabs">
    <button class="tab-btn active" id="tabDoctors" onclick="showTab('doctors')">👩‍⚕️ Врачи</button>
    <button class="tab-btn" id="tabServices" onclick="showTab('services')">💼 Услуги</button>
  </div>

  <!-- ================= ВРАЧИ ================= -->
  <div class="section active" id="sectionDoctors">

    <div class="block-title">Добавить врача</div>
    <div class="card">
      <label for="docName">ФИО врача</label>
      <input type="text" id="docName" placeholder="Например: Ахметова Айгуль Сериковна">

      <label for="docSpec">Специальность</label>
      <input type="text" id="docSpec" placeholder="Например: Косметолог">

      <button class="btn btn-add" onclick="addDoctor()">➕ Добавить врача</button>
    </div>

    <div class="block-title">Список врачей</div>
    <div id="doctorsList"><div class="loading">Загружаю…</div></div>
  </div>

  <!-- ================= УСЛУГИ ================= -->
  <div class="section" id="sectionServices">

    <div class="block-title">Добавить услугу</div>
    <div class="card">
      <label for="srvName">Название услуги</label>
      <input type="text" id="srvName" placeholder="Например: Чистка лица ультразвуковая">

      <label for="srvPrice">Цена, ₸ (только цифры)</label>
      <input type="number" id="srvPrice" placeholder="Например: 15000">

      <label for="srvCat">Категория</label>
      <input type="text" id="srvCat" placeholder="Например: Косметология">

      <button class="btn btn-add" onclick="addService()">➕ Добавить услугу</button>
    </div>

    <div class="block-title">Список услуг</div>
    <div id="servicesList"><div class="loading">Загружаю…</div></div>
  </div>

</div>

<script>
/* ============================================================
   ПОДКЛЮЧЕНИЕ К БАЗЕ — уже настроено, ничего менять не нужно
   ============================================================ */
var SUPABASE_URL = "https://ilfxyvsqintvjbifqxvr.supabase.co";
var SUPABASE_KEY = "sb_publishable_GEl1zhHAxT_i8zU2F86cOA_-G6n7uBH";

function apiHeaders() {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };
}

/* ---------- Сообщения пользователю ---------- */
var msgTimer = null;
function showMsg(text, isError) {
  var box = document.getElementById("msgBox");
  box.textContent = text;
  box.className = "msg-inner " + (isError ? "msg-error" : "msg-ok");
  box.style.display = "block";
  if (msgTimer) clearTimeout(msgTimer);
  msgTimer = setTimeout(function () { box.style.display = "none"; }, 5000);
}

/* ---------- Вкладки ---------- */
function showTab(name) {
  document.getElementById("sectionDoctors").className = "section" + (name === "doctors" ? " active" : "");
  document.getElementById("sectionServices").className = "section" + (name === "services" ? " active" : "");
  document.getElementById("tabDoctors").className = "tab-btn" + (name === "doctors" ? " active" : "");
  document.getElementById("tabServices").className = "tab-btn" + (name === "services" ? " active" : "");
}

/* ---------- Защита текста ---------- */
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ============================================================
   ВРАЧИ
   ============================================================ */
var doctorsData = [];

function loadDoctors() {
  fetch(SUPABASE_URL + "/rest/v1/sakura_doctors?select=*&order=id", { headers: apiHeaders() })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      doctorsData = data;
      renderDoctors();
      document.getElementById("connStatus").textContent = "✅ Связь с базой установлена";
      document.getElementById("connStatus").className = "conn-status conn-ok";
    })
    .catch(function (e) {
      document.getElementById("doctorsList").innerHTML =
        '<div class="loading">Не удалось загрузить список.</div>';
      document.getElementById("connStatus").textContent = "⚠️ Нет связи с базой. Проверьте интернет и обновите страницу.";
      document.getElementById("connStatus").className = "conn-status conn-error";
    });
}

function renderDoctors() {
  var html = "";
  if (doctorsData.length === 0) {
    html = '<div class="loading">Пока нет ни одного врача. Добавьте первого через форму выше.</div>';
  }
  for (var i = 0; i < doctorsData.length; i++) {
    var d = doctorsData[i];
    var active = (d.is_active !== false);
    html += '<div class="item' + (active ? "" : " inactive") + '" id="doc-' + d.id + '">'
      + '<div class="item-name">' + esc(d.full_name) + '</div>'
      + '<div class="item-sub">' + (d.specialty ? esc(d.specialty) : "Специальность не указана") + '</div>'
      + '<span class="item-badge ' + (active ? "badge-on" : "badge-off") + '">'
      + (active ? "Работает" : "Отключён") + '</span>'
      + '<div class="item-actions">'
      + '<button class="btn btn-edit" onclick="editDoctor(' + d.id + ')">✏️ Изменить</button>'
      + '<button class="btn btn-toggle" onclick="toggleDoctor(' + d.id + ', ' + (active ? "false" : "true") + ')">'
      + (active ? "Отключить" : "Включить") + '</button>'
      + '</div></div>';
  }
  document.getElementById("doctorsList").innerHTML = html;
}

function addDoctor() {
  var name = document.getElementById("docName").value.trim();
  var spec = document.getElementById("docSpec").value.trim();
  if (!name) { showMsg("Введите ФИО врача.", true); return; }

  fetch(SUPABASE_URL + "/rest/v1/sakura_doctors", {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ full_name: name, specialty: spec || null, is_active: true })
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function () {
      document.getElementById("docName").value = "";
      document.getElementById("docSpec").value = "";
      showMsg("Врач «" + name + "» добавлен.", false);
      loadDoctors();
    })
    .catch(function () { showMsg("Не удалось добавить. Проверьте связь и попробуйте ещё раз.", true); });
}

function editDoctor(id) {
  var d = null;
  for (var i = 0; i < doctorsData.length; i++) { if (doctorsData[i].id === id) d = doctorsData[i]; }
  if (!d) return;

  var el = document.getElementById("doc-" + id);
  el.innerHTML =
      '<label>ФИО врача</label>'
    + '<input type="text" id="editDocName-' + id + '" value="' + esc(d.full_name) + '">'
    + '<label>Специальность</label>'
    + '<input type="text" id="editDocSpec-' + id + '" value="' + esc(d.specialty) + '">'
    + '<div class="item-actions">'
    + '<button class="btn btn-save" onclick="saveDoctor(' + id + ')">💾 Сохранить</button>'
    + '<button class="btn btn-cancel" onclick="renderDoctors()">Отмена</button>'
    + '</div>';
}

function saveDoctor(id) {
  var name = document.getElementById("editDocName-" + id).value.trim();
  var spec = document.getElementById("editDocSpec-" + id).value.trim();
  if (!name) { showMsg("ФИО не может быть пустым.", true); return; }

  fetch(SUPABASE_URL + "/rest/v1/sakura_doctors?id=eq." + id, {
    method: "PATCH",
    headers: apiHeaders(),
    body: JSON.stringify({ full_name: name, specialty: spec || null })
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      showMsg("Изменения сохранены.", false);
      loadDoctors();
    })
    .catch(function () { showMsg("Не удалось сохранить. Попробуйте ещё раз.", true); });
}

function toggleDoctor(id, newState) {
  fetch(SUPABASE_URL + "/rest/v1/sakura_doctors?id=eq." + id, {
    method: "PATCH",
    headers: apiHeaders(),
    body: JSON.stringify({ is_active: newState })
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      showMsg(newState ? "Врач включён." : "Врач отключён (в списках больше не показывается).", false);
      loadDoctors();
    })
    .catch(function () { showMsg("Не удалось изменить статус. Попробуйте ещё раз.", true); });
}

/* ============================================================
   УСЛУГИ
   ============================================================ */
var servicesData = [];

function loadServices() {
  fetch(SUPABASE_URL + "/rest/v1/sakura_services?select=*&order=id", { headers: apiHeaders() })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      servicesData = data;
      renderServices();
    })
    .catch(function () {
      document.getElementById("servicesList").innerHTML =
        '<div class="loading">Не удалось загрузить список.</div>';
    });
}

function formatPrice(p) {
  if (p === null || p === undefined) return "Цена не указана";
  var s = String(Math.round(Number(p)));
  var out = "";
  var count = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    out = s.charAt(i) + out;
    count++;
    if (count % 3 === 0 && i > 0) out = " " + out;
  }
  return out + " ₸";
}

function renderServices() {
  var html = "";
  if (servicesData.length === 0) {
    html = '<div class="loading">Пока нет ни одной услуги. Добавьте первую через форму выше.</div>';
  }
  for (var i = 0; i < servicesData.length; i++) {
    var s = servicesData[i];
    html += '<div class="item" id="srv-' + s.id + '">'
      + '<div class="item-name">' + esc(s.name) + '</div>'
      + '<div class="item-sub">' + (s.category ? esc(s.category) : "Категория не указана") + '</div>'
      + '<div class="item-price">' + formatPrice(s.price) + '</div>'
      + '<div class="item-actions">'
      + '<button class="btn btn-edit" onclick="editService(' + s.id + ')">✏️ Изменить</button>'
      + '</div></div>';
  }
  document.getElementById("servicesList").innerHTML = html;
}

function addService() {
  var name = document.getElementById("srvName").value.trim();
  var price = document.getElementById("srvPrice").value.trim();
  var cat = document.getElementById("srvCat").value.trim();
  if (!name) { showMsg("Введите название услуги.", true); return; }
  if (!price || isNaN(Number(price))) { showMsg("Введите цену цифрами, например 15000.", true); return; }

  fetch(SUPABASE_URL + "/rest/v1/sakura_services", {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify({ name: name, price: Number(price), category: cat || null })
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function () {
      document.getElementById("srvName").value = "";
      document.getElementById("srvPrice").value = "";
      document.getElementById("srvCat").value = "";
      showMsg("Услуга «" + name + "» добавлена.", false);
      loadServices();
    })
    .catch(function () { showMsg("Не удалось добавить. Проверьте связь и попробуйте ещё раз.", true); });
}

function editService(id) {
  var s = null;
  for (var i = 0; i < servicesData.length; i++) { if (servicesData[i].id === id) s = servicesData[i]; }
  if (!s) return;

  var el = document.getElementById("srv-" + id);
  el.innerHTML =
      '<label>Название услуги</label>'
    + '<input type="text" id="editSrvName-' + id + '" value="' + esc(s.name) + '">'
    + '<label>Цена, ₸ (только цифры)</label>'
    + '<input type="number" id="editSrvPrice-' + id + '" value="' + (s.price !== null && s.price !== undefined ? s.price : "") + '">'
    + '<label>Категория</label>'
    + '<input type="text" id="editSrvCat-' + id + '" value="' + esc(s.category) + '">'
    + '<div class="item-actions">'
    + '<button class="btn btn-save" onclick="saveService(' + id + ')">💾 Сохранить</button>'
    + '<button class="btn btn-cancel" onclick="renderServices()">Отмена</button>'
    + '</div>';
}

function saveService(id) {
  var name = document.getElementById("editSrvName-" + id).value.trim();
  var price = document.getElementById("editSrvPrice-" + id).value.trim();
  var cat = document.getElementById("editSrvCat-" + id).value.trim();
  if (!name) { showMsg("Название не может быть пустым.", true); return; }
  if (!price || isNaN(Number(price))) { showMsg("Введите цену цифрами, например 15000.", true); return; }

  fetch(SUPABASE_URL + "/rest/v1/sakura_services?id=eq." + id, {
    method: "PATCH",
    headers: apiHeaders(),
    body: JSON.stringify({ name: name, price: Number(price), category: cat || null })
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      showMsg("Изменения сохранены.", false);
      loadServices();
    })
    .catch(function () { showMsg("Не удалось сохранить. Попробуйте ещё раз.", true); });
}

/* ---------- Запуск ---------- */
loadDoctors();
loadServices();
</script>
</body>
</html>
